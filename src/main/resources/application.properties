#---------------------------------------------------------------------
# SERVICE
#---------------------------------------------------------------------
spring.application.name=${SERVICE_NAME}
server.port=${SERVICE_PORT}
spring.profiles.active=${APPLICATION_INFRA_CODE}

# Service name
#spring.application.name=wsci-cloud-service-immobilier
#Service port
#server.port=9004
# Registre
eureka.client.region=default
eureka.client.registryFetchIntervalSeconds=5
eureka.client.serviceUrl.defaultZone=http://discUser:discPassword@${SERVER_DISCOVERY_HOST}:${SERVER_DISCOVERY_PORT}/eureka/
#eureka.client.serviceUrl.defaultZone=http://discUser:discPassword@localhost:9001/eureka/
#---------------------------------------------------------------------
# PROJECT
#---------------------------------------------------------------------
application-description=@project.description@
application-version=@project.version@
#---------------------------------------------------------------------
# SPRING
#---------------------------------------------------------------------
spring.jmx.enabled=false
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=INFO

#---------------------------------------------------------------------
# SPRING BOOT 3.x - JAVA 21
#---------------------------------------------------------------------
# ✅ Virtual Threads (Project Loom — GA Java 21)
spring.threads.virtual.enabled=true
# ✅ Micrometer Tracing (remplace Spring Cloud Sleuth)
management.tracing.sampling.probability=0.1
management.zipkin.tracing.endpoint=http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

#---------------------------------------------------------------------
# DATABASE
#---------------------------------------------------------------------
# Oracle 		=> oracle.jdbc.OracleDriver 
# Postgresql 	=> org.hibernate.dialect.PostgreSQLDialect
# MSQLSERVER	=> org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.database-platform=${DATABASE_PLATEFORME}
# Oracle 		=> oracle.jdbc.driver.OracleDriver 
# Postgresql 	=> org.postgresql.Driver
# MSQLSERVER	=> com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.driver-class-name=${DATABASE_DRIVER}
# Oracle 		=> jdbc:oracle:thin:@//localhost:11521/ORCLPDB1
# Postgresql 	=> jdbc:postgresql://localhost:5432/dev_infra_service
# MSQLSERVER	=> jdbc:sqlserver://DESKTOP-UD6IJ08\\SQLEXPRESS:1433;databaseName=db_osiris_infra
#spring.datasource.url=${DATABASE_URL}
#jdbc:postgresql://192.168.56.101:5432/bdd_dev_saas
spring.datasource.jdbcUrl=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_USERPWD}
#maximum number of milliseconds that a client will wait for a connection
spring.datasource.hikari.connection-timeout=30000
#minimum number of idle connections maintained by HikariCP in a connection pool
spring.datasource.hikari.minimum-idle=10
#maximum pool size
spring.datasource.hikari.maximum-pool-size=10
#maximum idle time for connection
spring.datasource.hikari.idle-timeout=18000
# maximum lifetime in milliseconds of a connection in the pool after it is closed.
spring.datasource.hikari.max-lifetime=18000
#default auto-commit behavior.
spring.datasource.hikari.auto-commit=true
# Number of ms to wait before throwing an exception if no connection is available.
spring.datasource.tomcat.max-wait=10000
# Maximum number of active connections that can be allocated from this pool at the same time.
spring.datasource.tomcat.max-active=10
# Validate the connection before borrowing it from the pool.
spring.datasource.tomcat.test-on-borrow=true

# Obtimisation de la BDD
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Active le regroupement des requêtes d'insertion
spring.jpa.properties.hibernate.jdbc.batch_size=20
# Force Hibernate à trier les inserts pour optimiser le batching
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.id.sequence.increment_size_mismatch_strategy=LOG

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# ✅ Hibernate 6 (SB 3.x) : naming strategy physique conservée, implicite supprimée (gérée nativement)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# ✅ Hibernate 6 : non_contextual_creation supprimé (corrigé nativement dans le driver PostgreSQL JDBC 42.x)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.event.merge.entity_copy_observer=allow
spring.jpa.properties.hibernate.dialect=${DATABASE_PLATEFORME}
# Schema PostgreSQL du module BTP (tables et sequences)
spring.jpa.properties.hibernate.default_schema=immobilier

#---------------------------------------------------------------------
# LIQUIDBASE
#---------------------------------------------------------------------
# Whether to enable Liquibase support.
spring.liquibase.enabled=true
# Whether to first drop the database schema.
##spring.liquibase.drop-first=false
# Change log configuration path.
#spring.liquibase.change-log=classpath:/${DATABASE_SCRIPT}/db.changelog-master.yaml
spring.liquibase.change-log=classpath:/db/changelog/postgresql/db.changelog-master.yaml
# Whether to check that the change log location exists.
#spring.liquibase.check-change-log-location=true 
# Name of table to use for tracking concurrent Liquibase usage.
spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
# Name of table to use for tracking change history.
spring.liquibase.database-change-log-table=DATABASECHANGELOG
# specific JDBC url (if not set the default datasource is used)
##spring.liquibase.url= 
# user name for liquibase.url
##spring.liquibase.user=
# password for liquibase.url 
##spring.liquibase.password= 

